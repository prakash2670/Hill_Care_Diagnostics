<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deccan Cloud Diagnostics</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Noto+Sans+Telugu:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
<style>
:root{--blue:#06699a;--teal:#0a8fa8;--aqua:#1db5a8;--sky:#e6f7fa;--mint:#e3f8f3;--ink:#12394d;--mute:#56788a;--line:#d8edf2;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:70px;scroll-behavior:smooth}*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:400 16px/1.55 Montserrat,"Noto Sans Telugu","Noto Sans Devanagari",system-ui,sans-serif;padding-bottom:64px}
img{max-width:100%;display:block}a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
.top{background:linear-gradient(90deg,var(--blue),var(--aqua));color:#fff;font-size:13px;font-weight:600;text-align:center;padding:7px 10px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#fff;box-shadow:0 2px 12px rgba(6,105,154,.08)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:62px;gap:10px}
.logo img{height:40px}
.lang{display:flex;gap:4px}
.lang button{border:1px solid var(--line);background:#fff;color:var(--blue);border-radius:999px;padding:6px 12px;font:700 13px Montserrat,"Noto Sans Telugu","Noto Sans Devanagari",sans-serif;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--aqua);outline-offset:2px}
.hero{background:radial-gradient(circle at 85% 20%,#c9f1ee,transparent 45%),linear-gradient(180deg,var(--sky),#fff)}
.hero .wrap{display:grid;grid-template-columns:1.2fr .8fr;gap:20px;align-items:center;padding-top:36px;padding-bottom:40px}
.hero h1{font-size:clamp(28px,5vw,44px);line-height:1.15;margin:0 0 10px;color:var(--blue);font-weight:800}
.hero p{margin:0 0 20px;font-size:17px;color:var(--mute)}
.sbox{display:flex;background:#fff;border:2px solid var(--aqua);border-radius:14px;box-shadow:0 8px 24px rgba(29,181,168,.18);overflow:hidden}
.sbox input{flex:1;border:0;padding:15px 16px;font:500 16px inherit;font-family:inherit;color:var(--ink);min-width:0;background:transparent}
.sbox a{background:linear-gradient(135deg,var(--blue),var(--aqua));color:#fff;text-decoration:none;font-weight:700;padding:0 20px;display:grid;place-items:center}
.vis{position:relative;display:grid;place-items:center}
.vis img.c{width:min(300px,70%);border-radius:50%;box-shadow:0 14px 40px rgba(6,105,154,.18)}
.pill{position:absolute;background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;color:var(--blue);box-shadow:0 6px 18px rgba(6,105,154,.18)}
.p1{top:8%;left:0}.p2{bottom:8%;right:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:-6px;padding-bottom:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 10px;border-radius:18px;text-decoration:none;font-weight:700;font-size:14px;color:var(--blue);background:var(--sky)}
.tile:nth-child(2){background:var(--mint)}.tile:nth-child(3){background:#e8f1fd}.tile:nth-child(4){background:#e3f8f3}
.tile span{font-size:28px}
section{padding:36px 0}
h2{font-size:25px;margin:0 0 16px;color:var(--blue)}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 4px 16px rgba(6,105,154,.06)}
.why .card{text-align:center;background:var(--sky);border:0;box-shadow:none}
.why b{display:block;font-size:26px;color:var(--teal)}
.why span{font-weight:600;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center;font-size:14px;color:var(--mute)}
.chips .c{background:var(--mint);border-radius:999px;padding:4px 12px;color:var(--ink);font-weight:600}
.band{background:var(--sky)}
.pk{background:linear-gradient(160deg,#fff,var(--mint))}
.pk h3{margin:0;font-size:18px;color:var(--blue)}.pk small{color:var(--mute)}
.pr{display:flex;align-items:baseline;gap:8px;margin:10px 0}.pr b{font-size:26px;color:var(--teal)}.pr s{color:var(--mute)}
.btn{display:inline-block;padding:11px 18px;border-radius:12px;font-weight:700;font-size:14px;text-decoration:none;background:linear-gradient(135deg,var(--blue),var(--aqua));color:#fff}
.test{display:flex;gap:14px;align-items:center}
.ico{flex:none;width:56px;height:56px;border-radius:16px;background:var(--sky);color:var(--blue);display:grid;place-items:center;font-weight:800;font-size:15px;overflow:hidden}
.ico img{width:100%;height:100%;object-fit:cover}
.test .mid{flex:1;min-width:0}.test h3{font-size:16px;margin:0}.test small{color:var(--mute);display:block}
.fast{font-size:12px;color:var(--aqua);font-weight:700}
.price{font-weight:800;font-size:18px;color:var(--blue);text-align:right}
.price a{display:block;margin-top:4px;font-size:13px;color:var(--teal);text-decoration:none}
.step{display:flex;gap:12px;align-items:center;font-weight:600}
.step i{flex:none;width:38px;height:38px;border-radius:50%;background:var(--aqua);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:800}
.offer{background:linear-gradient(135deg,var(--teal),var(--aqua));color:#fff;border:0}
.offer h3{margin:0;font-size:19px}
ul.plain{margin:0;padding-left:20px;color:var(--mute)}ul.plain li{margin:6px 0}
footer{background:var(--blue);color:#e6f7fa;padding:26px 0;font-size:14px}
footer .wrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap}footer img{width:50px;border-radius:12px}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;box-shadow:0 -4px 16px rgba(6,105,154,.12);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
.bar a{flex:1;text-align:center;padding:14px 4px;font-weight:700;font-size:14px;text-decoration:none;color:var(--blue)}
@media(min-width:760px){.bar{display:none}body{padding-bottom:0}}
@media(max-width:700px){.hero .wrap{grid-template-columns:1fr}.vis{display:none}}
</style>
</head>

const wa=t=>"https://wa.me/"+C.phone+"?text="+encodeURIComponent(t||"Hi, I'd like to book a test.");
const H={call:"tel:+"+C.phone,wa:wa(),mail:"mailto:"+C.email,map:C.map,form:C.form};
document.querySelectorAll("[data-href]").forEach(a=>a.href=H[a.dataset.href]);
document.getElementById("addr").textContent=C.addr;
document.getElementById("foot").textContent=C.phoneShow+" · "+C.email;
function draw(){
  const i=LI[L],q=document.getElementById("q").value.toLowerCase();
  document.documentElement.lang=L;
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=S[e.dataset.i][i]);
  document.getElementById("q").placeholder=S.search[i];
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===L));
  document.getElementById("pk").innerHTML=P.map(p=>`<div class="card pk"><h3>${p[0]}</h3><small>${p[3]}+ ${S.params[i]}</small><div class="pr"><b>₹${p[1]}</b><s>₹${p[2]}</s></div><a class="btn" href="${wa("Hi, I'd like to book: "+p[0])}" target="_blank" rel="noopener">${S.book[i]}</a></div>`).join("");
  document.getElementById("list").innerHTML=T.filter(t=>(t[0]+t[4+i]).toLowerCase().includes(q)).map(t=>
   `<div class="card test"><div class="ico">${t[3]==="CA"?`<img src="${CA}" alt="">`:t[3]}</div>
    <div class="mid"><h3>${t[0]}</h3><small>${t[4+i]}</small><span class="fast">${t[2]?S.fast[i]:S.nofast[i]}</span></div>
    <div class="price">₹${t[1]}<a href="${wa("Hi, I'd like to book: "+t[0])}" target="_blank" rel="noopener">${S.book[i]}</a></div></div>`).join("");
  document.getElementById("offers").innerHTML=O.map(o=>`<div class="card offer"><h3>🎁 ${o[i]}</h3></div>`).join("");
}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem("dcd-lang",L)}catch(e){}draw()});
document.getElementById("q").oninput=draw;
draw();
</script>
</body>
</html>
